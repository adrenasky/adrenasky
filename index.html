20d%3D%22M9.2%2038.6%20L%2044.5%2038.2%20L%2044.5%2040.6%20L%209.6%2041.2%20Z%20M90.8%2038.6%20L%2055.5%2038.2%20L%2055.5%2040.6%20L%2090.4%2041.2%20Z%22%20fill%3D%22%23F2B33D%22/%3E%3Cellipse%20cx%3D%2250%22%20cy%3D%2240%22%20rx%3D%223.3%22%20ry%3D%227%22%20fill%3D%22%230B1622%22/%3E%3Crect%20x%3D%2238%22%20y%3D%225%22%20width%3D%2224%22%20height%3D%222.4%22%20rx%3D%221.2%22%20fill%3D%22%23F2B33D%22%20opacity%3D%220.9%22/%3E%3C/g%3E%3C/g%3E%3C/g%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Barlow+Condensed:wght@500;600;700&family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E9F0F4; --surface:#FFFFFF; --ink:#13232F; --muted:#566875;
  --chart:#1F4E79; --magenta:#A3195B; --ok:#2E7D4F; --bad:#B3261E; --line:#C8D5DE; --lamp:#E8A800; --lampoff:#D3DDE4;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1922; --surface:#15242F; --ink:#E5EDF2; --muted:#93A5B3; --chart:#86B7E0; --magenta:#E36FA5;
    --ok:#5BC489; --bad:#F2796F; --line:#29404F; --lamp:#FFC23D; --lampoff:#2A3B47;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1922; --surface:#15242F; --ink:#E5EDF2; --muted:#93A5B3; --chart:#86B7E0; --magenta:#E36FA5;
  --ok:#5BC489; --bad:#F2796F; --line:#29404F; --lamp:#FFC23D; --lampoff:#2A3B47;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:17px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,.cond{font-family:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;font-weight:600;letter-spacing:.01em;line-height:1.1}
main{max-width:680px;margin:0 auto;padding:20px 18px 48px}
header.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:22px}
.brand{font-size:30px;margin:0;color:var(--chart)}
.brand small{display:block;font-family:"Atkinson Hyperlegible",sans-serif;font-size:14px;font-weight:400;color:var(--muted);letter-spacing:0;margin-top:4px}
button,.btn{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:14px 18px;font-weight:700;min-height:48px}
button:focus-visible,a:focus-visible{outline:3px solid var(--magenta);outline-offset:2px}
.primary{background:var(--chart);color:#fff}
:root[data-theme="dark"] .primary{color:#0D1922}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .primary{color:#0D1922}}
.ghost{background:transparent;color:var(--chart);border:2px solid var(--chart)}
.link{background:none;border:0;padding:6px 0;min-height:auto;color:var(--chart);font-weight:700;text-decoration:underline;text-underline-offset:3px}
.small{font-size:14px;color:var(--muted)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row > *{flex:1 1 200px}

/* Briefing panel: the one bold element, styled like a chart airspace boundary */
.briefing{position:relative;background:var(--surface);border-radius:18px;padding:22px 20px 20px;margin-bottom:26px;outline:3px dashed var(--magenta);outline-offset:-9px}
.briefing h2{font-size:44px;margin:0;color:var(--ink)}
.briefing p{margin:6px 0 18px;color:var(--muted)}

.topics{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.topics li{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:14px 2px;border-bottom:1px solid var(--line)}
.topics .name{font-weight:700}
.topics .acc{font-size:14px;color:var(--muted);grid-column:1}
.lamps{display:flex;gap:6px;align-items:center;grid-row:1 / span 2;grid-column:2}
.lamp{width:11px;height:11px;border-radius:50%;background:var(--lampoff)}
.lamp.on{background:var(--lamp);box-shadow:0 0 6px var(--lamp)}
h3.section{font-size:24px;margin:0 0 6px}

/* Question */
.qcard{background:var(--surface);border-radius:14px;padding:20px;margin:14px 0}
.qmeta{display:flex;justify-content:space-between;gap:10px;font-size:14px;color:var(--muted);margin-bottom:10px}
.qtext{font-size:19px;font-weight:700;margin:0 0 16px}
.opts{display:grid;gap:10px}
.opt{text-align:left;background:var(--bg);color:var(--ink);border:2px solid var(--line);font-weight:400;line-height:1.35}
.opt.sel{border-color:var(--chart);background:color-mix(in srgb,var(--chart) 12%,var(--surface))}
.opt.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,var(--surface))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--surface))}
.opt:disabled{cursor:default;opacity:1}
.explain{margin-top:16px;padding:14px 16px;border-left:4px solid var(--chart);background:var(--bg);border-radius:0 10px 10px 0}
.explain strong{display:block;margin-bottom:4px}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin:8px 0 4px}
.bar span{display:block;height:100%;background:var(--chart);transition:width .25s}
.timer{font-family:"Barlow Condensed",sans-serif;font-size:26px;font-weight:600}
.timer.low{color:var(--bad)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:6px;margin:14px 0}
.grid button{min-height:40px;padding:0;background:var(--surface);color:var(--ink);border:2px solid var(--line);font-weight:700;font-size:14px}
.grid button.done{background:var(--chart);border-color:var(--chart);color:var(--surface)}
.grid button.cur{border-color:var(--magenta)}
.score{font-size:64px;margin:0;color:var(--chart)}
.pass{color:var(--ok)} .fail{color:var(--bad)}
table{width:100%;border-collapse:collapse;font-size:15px}
td,th{padding:8px 4px;border-bottom:1px solid var(--line);text-align:left}
th{color:var(--muted);font-weight:400}
.wrapx{overflow-x:auto}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:15px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
.back{margin-bottom:6px;display:inline-flex;align-items:center;gap:4px}
/* ---- App shell ---- */
body.has-tabs main{padding-bottom:110px}
#tabbar{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;background:var(--surface);border-top:1px solid var(--line);padding:4px 6px calc(8px + env(safe-area-inset-bottom,0px))}
#tabbar[hidden]{display:none}
#tabbar .tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;min-height:56px;justify-content:center;background:none;border:0;color:var(--muted);font:inherit;font-size:12px;font-weight:600;padding:4px 0;border-radius:10px}
#tabbar .tab.on{color:var(--chart);font-weight:700}
@media (min-width:760px){#tabbar{left:50%;transform:translateX(-50%);max-width:680px;border-radius:16px 16px 0 0;border:1px solid var(--line);border-bottom:0}}
.apphead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:-4px 0 16px}
.brandrow{display:flex;align-items:center;gap:8px;color:var(--ink)}
.brandword{font-family:"Bricolage Grotesque","Arial Black",sans-serif;font-weight:800;font-size:18px;letter-spacing:.05em}
.subjpill{display:flex;align-items:center;gap:6px;min-height:44px;padding:0 14px;border-radius:22px;background:var(--surface);border:1px solid var(--line);color:var(--ink);font:inherit;font-weight:600;font-size:15px}
.disp{font-family:"Bricolage Grotesque","Arial Black",sans-serif;font-weight:800;text-transform:uppercase;font-size:17px;letter-spacing:.02em;margin:0;display:block}
.disp.big{font-size:28px;line-height:1.05;margin:4px 0 12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
.eyebrow{display:block;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.readycard{display:flex;align-items:center;gap:16px}.readycard>div{display:flex;flex-direction:column;gap:4px}
.ringtxt{font-family:"Bricolage Grotesque","Arial Black",sans-serif;font-weight:800;font-size:20px;fill:var(--ink)}
.charttxt{font-family:"Source Sans 3",sans-serif;font-size:12px;font-weight:700;fill:var(--ink)}
.stat3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat3 .card{padding:14px}
.statn{display:flex;align-items:center;gap:6px;font-family:"Bricolage Grotesque","Arial Black",sans-serif;font-weight:800;font-size:22px;color:var(--ink)}
.statn svg{color:var(--chart)}
.statn.fail{color:var(--bad)}.statn.mid{color:var(--chart)}.statn.pass{color:var(--ok)}
button.full{width:100%}
.chaprow{all:unset;cursor:pointer;display:flex;align-items:center;gap:12px;width:100%;box-sizing:border-box;padding:12px 0;border-bottom:1px solid var(--line);color:var(--ink)}
.chaprow:last-child{border-bottom:0}.chaprow:focus-visible{outline:3px solid var(--magenta);outline-offset:2px}
.chaprow svg{color:var(--muted);flex-shrink:0}
.cr-main{flex:1;display:flex;flex-direction:column;gap:6px;min-width:0}
.cr-top{display:flex;justify-content:space-between;gap:8px}.cr-name{font-weight:600;font-size:15px}
.cr-acc{font-size:13px;font-weight:700;color:var(--muted);white-space:nowrap}.cr-acc.fail{color:var(--bad)}.cr-acc.mid{color:var(--chart)}.cr-acc.pass{color:var(--ok)}
.qrow{all:unset;cursor:pointer;display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line);font-size:15px;line-height:1.35;color:var(--ink);width:100%;box-sizing:border-box}
.qrow svg.bad,.qrow svg{color:var(--bad);flex-shrink:0;margin-top:2px}
.keyl{margin:8px 0;padding-left:18px;line-height:1.45}
.seg3{display:flex;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:5px;margin-bottom:12px}
.seg3 button{flex:1;min-height:44px;border-radius:10px;border:0;background:transparent;color:var(--muted);font:inherit;font-weight:700;font-size:14px;padding:0 4px}
.seg3 button[aria-selected="true"]{background:var(--chart);color:var(--bg)}
.qitem{all:unset;cursor:pointer;display:flex;flex-direction:column;gap:6px;width:100%;box-sizing:border-box;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px}
.qitem .qi{font-weight:600;font-size:15px;line-height:1.35}
.iconbtn{width:44px;height:44px;display:inline-flex;align-items:center;justify-content:center;background:transparent;border:0;color:var(--muted);border-radius:10px;padding:0;min-height:44px}
.iconbtn.on{color:var(--chart)}.iconbtn.star.on svg{fill:var(--chart)}.iconbtn.flagb.on{color:var(--magenta)}
fieldset.opts2{border:0;padding:0;margin:0 0 16px;display:flex;flex-direction:column;gap:10px}
fieldset.opts2 legend{font-weight:700;margin-bottom:8px;padding:0}
.radcard{display:flex;gap:12px;align-items:center;padding:14px;border-radius:14px;background:var(--surface);border:1px solid var(--line);cursor:pointer}
.radcard.on{border:2px solid var(--chart)}.radcard input{width:22px;height:22px;accent-color:var(--chart)}
.radcard b{display:block}.chklist{display:grid;gap:8px;max-height:280px;overflow:auto;padding:4px 2px}
.chklist label{display:flex;gap:10px;align-items:center}.chklist input{width:20px;height:20px}
.exrow{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}.exrow:last-child{border-bottom:0}
.exhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.small-btn{min-height:40px;padding:6px 14px}
.exmeta{display:flex;justify-content:space-between;margin:4px 0 2px}
.grid button.mk{position:relative}.grid button.mk::after{content:"";position:absolute;top:3px;right:3px;width:7px;height:7px;border-radius:50%;background:var(--magenta)}
.resultcard{text-align:left}
.toggle{display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:44px}
.toggle input{width:22px;height:22px;accent-color:var(--chart)}
.sheetwrap{align-items:flex-end;padding:0}
.sheet{background:var(--surface);border-top:1px solid var(--line);border-radius:22px 22px 0 0;padding:12px 18px calc(24px + env(safe-area-inset-bottom,0px));width:100%;max-width:680px;box-sizing:border-box;color:var(--ink);display:flex;flex-direction:column;gap:8px}
.grab{width:44px;height:5px;border-radius:3px;background:var(--line);align-self:center;margin-bottom:8px}
.subjopt{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:60px;padding:10px 14px;border-radius:14px;background:transparent;border:1px solid var(--line);color:var(--ink);font:inherit;text-align:left}
.subjopt>span{display:flex;flex-direction:column;gap:2px}.subjopt.cur{border:2px solid var(--chart)}.subjopt:disabled{opacity:.5}
.reportcard{display:flex;gap:14px;align-items:center;background:var(--surface);border-radius:14px;padding:16px 18px;margin-top:26px}
.reportcard>div{flex:1}.reportcard b{display:block}.reportcard span{font-size:14px;color:var(--muted)}
fieldset.seg{border:0;padding:0;margin:0;display:flex;gap:18px;flex-wrap:wrap}
fieldset.seg legend{font-weight:700;font-size:15px;margin-bottom:6px;padding:0}
fieldset.seg label{display:flex;gap:8px;align-items:center;font-weight:400}
fieldset.seg input{width:20px;height:20px;min-height:auto}
blockquote.quote{margin:10px 0 6px;padding:8px 14px;border-left:3px solid var(--chart);font-style:italic}
a.btn{min-height:48px;padding:12px 18px;border-radius:10px;font-weight:700}
/* ---- Landing page theme: Night runway ---- */
body.nr{--bg:#0B1622;--surface:#13233A;--ink:#EAF1F7;--muted:#A9BCCB;--chart:#F2B33D;--magenta:#6FC3DF;--line:#22385A;--ok:#5BC489;--bad:#F2796F;
  background:#0B1622;color:#EAF1F7;font-family:"Source Sans 3","Segoe UI",sans-serif}
body.landing-on main{max-width:1040px}
body.nr .primary{background:#F2B33D;color:#0B1622}
body.nr .ghost{color:#EAF1F7;border-color:#EAF1F7}
body.nr .link{color:#F2B33D}
body.nr .brand,body.nr .hero h2,body.nr h3.section,body.nr .briefing h2,body.nr .note h2{font-family:"Bricolage Grotesque","Arial Black",sans-serif;font-weight:800;text-transform:uppercase;letter-spacing:.01em}
body.nr .brand{color:#EAF1F7;font-size:26px;letter-spacing:.04em}
body.nr .hero h2{font-size:clamp(44px,9vw,84px);line-height:.98}
body.nr .hero h2 span{color:#F2B33D}
body.nr .stats3 b,body.nr .plan b{font-family:"Bricolage Grotesque","Arial Black",sans-serif;color:#F2B33D}
body.nr .briefing{outline:none;border:1px solid #22385A}
body.nr .stats3 div,body.nr .feat div,body.nr .plan,body.nr .faq details{border:1px solid #22385A}
body.nr .plan.best{border:2px solid #F2B33D}
body.nr .auth input{background:#0B1622;color:#EAF1F7;border-color:#22385A}
.stripes{display:flex;gap:9px;margin:4px 0 26px}.stripes i{display:block;width:12px;height:52px;background:#EAF1F7;opacity:.9}
@media (max-width:520px){.stripes i{width:9px;height:40px}}
.hero{padding:8px 0 4px;position:relative}
.hero .eyebrow{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
.hero h2{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:700;font-size:clamp(46px,11vw,72px);line-height:.95;margin:0 0 14px}
.hero h2 span{color:var(--magenta)}
.hero .lead{font-size:18px;margin:0 0 20px;max-width:34em}
.stats3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:26px 0 30px}
.stats3 div{background:var(--surface);border-radius:12px;padding:14px}
.stats3 b{display:block;font-family:"Barlow Condensed",sans-serif;font-size:32px;color:var(--chart);line-height:1}
.stats3 span{font-size:13px;color:var(--muted)}
.feat{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:12px;margin-bottom:28px}
.feat div{background:var(--surface);border-radius:12px;padding:16px}
.feat p{margin:6px 0 0;font-size:15px;color:var(--muted)}
.steps{padding-left:22px;margin:0 0 28px}.steps li{margin-bottom:10px}
.plans{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:12px}
.plan{background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:18px}
.plan.best{border-color:var(--chart)}
.plan .pl{display:block;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

<body>
<main id="app" aria-live="polite"></main>
<nav id="tabbar" aria-label="Main" hidden></nav>
<div class="toast" id="toast" role="status"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
/* ===================== DATABASE CONNECTION ===================== */
const SUPABASE_URL = "https://rvwdcwrhgblkfxlewgpi.supabase.co";
const SUPABASE_KEY = "sb_publishable_e5tb_2_jqWwza-pPpZ3c0g_AuAHkdYF"; // publishable key, safe in the browser
/* Each browser gets a permanent device ID, sent with every request so the
   database can enforce the device limit. */
function getDeviceId(){
  const make=()=> (window.crypto&&crypto.randomUUID) ? crypto.randomUUID()
    : Date.now().toString(36)+Math.random().toString(36).slice(2)+Math.random().toString(36).slice(2);
  try{ let id=localStorage.getItem("adrenasky-device"); if(!id){ id=make(); localStorage.setItem("adrenasky-device",id); } return id; }
  catch(e){ return "nostorage-"+make(); }
}
function deviceLabel(){
  const u=navigator.userAgent;
  const b=/Edg\//.test(u)?"Edge":/OPR\//.test(u)?"Opera":/(CriOS|Chrome)\//.test(u)?"Chrome":/(FxiOS|Firefox)\//.test(u)?"Firefox":/Safari\//.test(u)?"Safari":"Browser";
  const o=/iPhone/.test(u)?"iPhone":/iPad/.test(u)?"iPad":/Android/.test(u)?"Android":/Mac OS X|Macintosh/.test(u)?"Mac":/Windows/.test(u)?"Windows":/Linux/.test(u)?"Linux":"device";
  return b+" on "+o;
}
const DEVICE_ID = getDeviceId();
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {global:{headers:{"x-device-id":DEVICE_ID}}});
let USER = null;
/* ===================== CONTENT =====================
   Sample questions written for testing. Every item must be checked
   by the instructor before launch. Format matches the future database:
   id, topic, q, options[4], answer (index), explanation            */
/* Subjects and chapters are loaded from the database */
let SUBJECTS = [], SUBJ = null, SUBJECT = "", TOPICS = [];
const PASS_MARK = 75; // percent, set to the KCAA pass mark
/* Draft questions, to be checked by the instructor before launch */
let QUESTIONS = []; // loaded from the database after login

/* Notes, key points and comparison tables are loaded from the database */
let NOTES = {}, FOCUS = {}, COMPARE = {};
function focusBody(q){
  const n=NOTES[q.topic]||{points:[]}; const f=FOCUS[q.id]||[];
  const pts=f.filter(Boolean);
  const c=COMPARE[q.id];
  let h=pts.length?`<ul>${pts.map(p=>`<li>${esc(p)}</li>`).join("")}</ul>`:"";
  if(c) h+=`<p style="margin:10px 0 6px;font-weight:700">${esc(c.title)}</p><div class="wrapx"><table class="cmp">
    <tr><th></th>${c.cols.map(x=>`<th>${esc(x)}</th>`).join("")}</tr>
    ${c.rows.map(r=>`<tr><th scope="row">${esc(r[0])}</th>${r.slice(1).map(x=>`<td>${esc(x)}</td>`).join("")}</tr>`).join("")}</table></div>`;
  return h;
}
function inlineNotes(q, open){
  const focus=focusBody(q);
  return `${focus?`<details class="inline-note" ${open?"open":""}><summary>Key point</summary>${focus}</details>`:""}
    ${NOTES[q.topic]?`<details class="inline-note"><summary>Full ${esc(topicName(q.topic))} note</summary>${noteBody(q.topic)}</details>`:""}`;
}

/* ===================== STATE ===================== */

const KEY = "cleared-met-v1";
const INTERVALS = [0, 1, 2, 4, 8, 16]; // days for Leitner boxes 0..5
const DAY = 86400000;
function save(){} // progress is saved to the database as it happens
let S = {cards:{},exams:[],flags:[],saved:new Set(),days:new Set()};
function dbErr(error){ if(error){ console.error(error); toast("Couldn't save. Check your connection."); } }
function card(id){ return S.cards[id] || (S.cards[id]={box:0,due:0,seen:0,right:0}); }
function record(id, ok, schedule){
  const c=card(id); c.seen++; if(ok) c.right++; c.last=ok;
  if(schedule){ c.box = ok ? Math.min(c.box+1,5) : 1; c.due = Date.now() + INTERVALS[c.box]*DAY; }
  markStudyDay();
  if(USER) sb.from("card_progress").upsert({user_id:USER.id, question_id:id, box:c.box,
    due_at:new Date(c.due||Date.now()).toISOString(), seen:c.seen, correct:c.right, last_correct:ok, updated_at:new Date().toISOString()})
    .then(({error})=>dbErr(error));
}

/* ===================== HELPERS ===================== */
const $ = s => document.querySelector(s);
const app = $("#app");
const esc = t => String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const topicName = id => (TOPICS.find(t=>t.id===id)||{}).name || id;
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove("show"),2200); }
function ask(msg, yes, no, onYes){
  const w=document.createElement("div"); w.className="modal"; w.setAttribute("role","dialog"); w.setAttribute("aria-modal","true");
  w.innerHTML=`<div class="modal-box"><p>${esc(msg)}</p><div class="row"><button class="ghost" data-a="no">${esc(no)}</button><button class="primary" data-a="yes">${esc(yes)}</button></div></div>`;
  document.body.appendChild(w);
  const close=()=>w.remove();
  w.querySelector('[data-a="no"]').onclick=close;
  w.querySelector('[data-a="yes"]').onclick=()=>{close(); onYes();};
  w.onclick=e=>{ if(e.target===w) close(); };
  w.querySelector('[data-a="yes"]').focus();
}
let timerId=null; function stopTimer(){ if(timerId){clearInterval(timerId); timerId=null;} }
function topicStats(tid){
  const qs=QUESTIONS.filter(q=>q.topic===tid); let seen=0,right=0,boxes=0;
  qs.forEach(q=>{const c=S.cards[q.id]; if(c){seen+=c.seen;right+=c.right;boxes+=c.box;}});
  return {count:qs.length, acc: seen? Math.round(right/seen*100):null, level: qs.length? Math.round(boxes/qs.length):0};
}
function flag(id){
  if(S.flags.includes(id)){ toast("Already reported"); return; }
  S.flags.push(id);
  sb.from("question_reports").insert({user_id:USER.id, question_id:id}).then(({error})=>{ dbErr(error); if(!error) toast("Question "+id+" reported. Thank you."); });
}

/* ===================== NOTES ===================== */
function noteBody(tid){
  const n=NOTES[tid]; if(!n) return `<p class="small">Notes for this topic are coming soon.</p>`;
  // Lines starting "## " are section headings inside the note
  let html="", open=false;
  (n.points||[]).forEach(p=>{
    if(/^##\s/.test(p)){ if(open){ html+="</ul>"; open=false; } html+=`<h4 class="nsec">${esc(p.replace(/^##\s*/,""))}</h4>`; }
    else { if(!open){ html+="<ul>"; open=true; } html+=`<li>${esc(p)}</li>`; }
  });
  if(open) html+="</ul>";
  return html+(n.aid?`<div class="aid"><strong>Memory aid</strong>${esc(n.aid)}</div>`:"")
    +(n.trap?`<div class="trapbox"><strong>Exam trap</strong>${esc(n.trap)}</div>`:"");
}
/* ===================== REVISION (spaced repetition) ===================== */
function study(topic, custom, back){
  hideTabs(); stopTimer();
  const now=Date.now(); back=back||home;
  let queue;
  if(custom){ queue=shuffle(custom).slice(0,20); }
  else if(topic==="__hy"){
    // High-yield: due first, then unseen, then the weakest ones
    const hy=QUESTIONS.filter(q=>q.hy), box=q=>(S.cards[q.id]||{box:0}).box;
    const due=shuffle(hy.filter(q=>{const c=S.cards[q.id]; return c&&c.box>0&&c.due<=now;}));
    const rest=shuffle(hy.filter(q=>!due.includes(q))).sort((a,b)=>box(a)-box(b));
    queue=due.concat(rest).slice(0,20);
  }
  else if(topic){ queue=shuffle(QUESTIONS.filter(q=>q.topic===topic)).slice(0,10); }
  else {
    const due=shuffle(QUESTIONS.filter(q=>{const c=S.cards[q.id]; return c&&c.box>0&&c.due<=now;}));
    const fresh=shuffle(QUESTIONS.filter(q=>!S.cards[q.id]||S.cards[q.id].box===0));
    queue=due.concat(fresh).slice(0,15);
  }
  let i=0, right=0;
  const orders=queue.map(()=>shuffle([0,1,2,3])); // keep option order stable when going back
  const picks=new Array(queue.length).fill(null); // answer chosen for each question, once answered
  const firstLen=queue.length, MAX_REVIEW=5; let reviewAdded=false, reviewRight=0;
  function show(){
    if(i>=queue.length){
      // One quick review round of the questions missed this session (first attempts only)
      if(!reviewAdded){
        reviewAdded=true;
        const missed=queue.slice(0,firstLen).filter((q,k)=>picks[k]!==null&&picks[k]!==q.answer).slice(0,MAX_REVIEW);
        if(missed.length) return reviewIntro(missed);
      }
      return summary();
    }
    const q=queue[i], order=orders[i], done=picks[i]!==null, isReview=i>=firstLen;
    app.innerHTML=`
      <button class="link back" id="quit">${icon("back",18)} Finish later</button>
      <div class="bar"><span style="width:${Math.min(i,firstLen)/firstLen*100}%"></span></div>
      <div class="small">${isReview?`Quick review ${i-firstLen+1} of ${queue.length-firstLen}`:`Question ${i+1} of ${firstLen}`}${done?" · reviewing":""}</div>
      <article class="qcard">
        <div class="qmeta" style="align-items:center"><span>${esc(topicName(q.topic))}</span><span style="display:flex;align-items:center;gap:4px">${q.hy?'<span class="hyb">High-yield</span>':""}${q.id}${starBtn(q)}</span></div>
        <p class="qtext">${esc(q.q)}</p>
        <div class="opts">${order.map(o=>`<button class="opt" data-o="${o}">${esc(q.options[o])}</button>`).join("")}</div>
        <div id="after"></div>
      </article>
      <div class="row" id="navrow" style="margin-top:4px">${i>0&&i!==firstLen?`<button class="ghost" id="prev">Previous</button>`:""}${isReview&&!done?`<button class="link" id="skiprev" style="min-height:auto">Finish now</button>`:""}</div>`;
    $("#quit").onclick=()=>back();
    wireStars();
    const pv=$("#prev"); if(pv) pv.onclick=()=>{ i--; show(); };
    const sk=$("#skiprev"); if(sk) sk.onclick=()=>summary();
    const reveal=(pick, fresh)=>{
      const ok=pick===q.answer;
      app.querySelectorAll(".opt").forEach(x=>{x.disabled=true; const o=+x.dataset.o;
        if(o===q.answer) x.classList.add("right"); else if(o===pick) x.classList.add("wrong");});
      $("#after").innerHTML=`<div class="explain"><strong class="${ok?"pass":"fail"}">${ok?"Correct":"Not quite"}</strong>${esc(q.explanation)}
        ${inlineNotes(q, !ok)}</div>
        <button class="link" id="rep" style="margin-top:8px">Report a problem with this question</button>`;
      $("#navrow").innerHTML=`${i>0&&i!==firstLen?`<button class="ghost" id="prev">Previous</button>`:""}<button class="primary" id="next">${i+1<queue.length?"Next question":"Finish session"}</button>`;
      const p2=$("#prev"); if(p2) p2.onclick=()=>{ i--; show(); };
      $("#next").onclick=()=>{i++;show();}; if(fresh) $("#next").focus();
      $("#rep").onclick=()=>flag(q.id);
    };
    if(done) return reveal(picks[i], false);
    app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
      const pick=+b.dataset.o, ok=pick===q.answer;
      picks[i]=pick;
      if(isReview){ if(ok) reviewRight++; }          // review answers don't change scores or the schedule
      else { if(ok) right++; record(q.id, ok, true); }
      reveal(pick, true);
    });
  }
  function reviewIntro(missed){
    app.innerHTML=`<section class="briefing"><h2>Quick review</h2>
      <p>You missed ${missed.length===1?"one question":missed.length+" questions"} this session. Try ${missed.length===1?"it":"them"} once more while ${missed.length===1?"it's":"they're"} fresh. The options are reshuffled, and this round doesn't affect your score.</p>
      <div class="row"><button class="primary" id="rv-go">Start quick review</button><button class="ghost" id="rv-skip">Finish now</button></div></section>`;
    $("#rv-go").onclick=()=>{ missed.forEach(q=>{ queue.push(q); orders.push(shuffle([0,1,2,3])); picks.push(null); }); show(); };
    $("#rv-skip").onclick=()=>summary();
  }
  function summary(){
    const reviewed=queue.length-firstLen;
    app.innerHTML=`<section class="briefing"><h2>${right} of ${firstLen} correct</h2>
      ${reviewed?`<p><b>Quick review:</b> ${reviewRight} of ${reviewed} right on the second try.</p>`:""}
      <p>Questions you missed will come back first next time. Correct ones return after a longer gap each time you get them right.</p>
      <div class="row"><button class="primary" id="h">Done</button></div></section>`;
    $("#h").onclick=()=>back();
  }
  show();
}

/* ===================== PRACTICE EXAM ===================== */
function pickExam(n, only){
  // weighted pick across topics, no repeats; "only" = optional set of chapter ids
  const base=only?QUESTIONS.filter(q=>only.has(q.topic)):QUESTIONS;
  const pool=shuffle(base), out=[];
  // Each chapter's share of the exam follows its real-exam weight, however many questions it holds
  const counts={}; base.forEach(q=>counts[q.topic]=(counts[q.topic]||0)+1);
  const weightOf=q=>((TOPICS.find(t=>t.id===q.topic)||{weight:1}).weight)/(counts[q.topic]||1);
  while(out.length<Math.min(n,base.length)){
    const left=pool.filter(q=>!out.includes(q)); const total=left.reduce((s,q)=>s+weightOf(q),0);
    let r=Math.random()*total; for(const q of left){ r-=weightOf(q); if(r<=0){out.push(q);break;} }
  }
  return out;
}
/* ===================== THEME, NAVIGATION AND SHARED PIECES ===================== */
function themePref(){ try{ return localStorage.getItem("adrenasky-theme")||"night"; }catch(e){ return "night"; } }
function applyTheme(){ document.body.classList.toggle("nr", document.body.classList.contains("landing-on") || themePref()==="night"); }
function setTheme(t){ try{ localStorage.setItem("adrenasky-theme",t); }catch(e){} applyTheme(); }
const ICONS={home:'<path d="M3 11l9-7 9 7"></path><path d="M5 10v10h14V10"></path>',
 study:'<path d="M4 5h7a3 3 0 0 1 3 3v12a2 2 0 0 0-2-2H4z"></path><path d="M20 5h-5a3 3 0 0 0-3 3"></path><path d="M20 5v13h-6"></path>',
 exam:'<rect x="4" y="3" width="16" height="18" rx="2"></rect><path d="M8 8h8M8 12h8M8 16h5"></path>',
 review:'<path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"></path>',
 progress:'<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"></path>', down:'<path d="M6 9l6 6 6-6"></path>',
 flame:'<path d="M12 3c1 4 5 5 5 10a5 5 0 0 1-10 0c0-3 2-4 2-7 2 1 3 3 3 3"></path>', chev:'<path d="M9 6l6 6-6 6"></path>',
 x:'<path d="M6 6l12 12M18 6L6 18"></path>', flag:'<path d="M5 21V4h11l-2 4 2 4H5"></path>', back:'<path d="M15 6l-6 6 6 6"></path>'};
const icon=(k,s=22,extra="")=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" ${extra}>${ICONS[k]}</svg>`;
const PLANE='<svg viewBox="0 0 100 100" width="30" height="30" aria-hidden="true"><g transform="rotate(40 50 50)"><path d="M50 95 C 50 106, 46 115, 37 121 C 28 127, 16 129, 2 127" fill="none" stroke="#F2B33D" stroke-width="6" stroke-linecap="round"/><path d="M44.5 30 L9 33 C6.5 33.3 5.5 35 5.8 37 L6.4 41.5 C6.6 43 7.8 44 9.4 44 L44.5 45 Z M55.5 30 L91 33 C93.5 33.3 94.5 35 94.2 37 L93.6 41.5 C93.4 43 92.2 44 90.6 44 L55.5 45 Z M47.5 77 L30 80 C28.6 80.3 28 81.4 28.2 82.6 L28.6 85 C28.8 86 29.6 86.6 30.6 86.6 L47.5 86.5 Z M52.5 77 L70 80 C71.4 80.3 72 81.4 71.8 82.6 L71.4 85 C71.2 86 70.4 86.6 69.4 86.6 L52.5 86.5 Z M50 6 C53.6 6 55 10 55.2 16 L55.3 46 C55 60 53.4 74 52.4 86 L47.6 86 C46.6 74 45 60 44.7 46 L44.8 16 C45 10 46.4 6 50 6 Z" fill="currentColor"/><rect x="38" y="5" width="24" height="2.4" rx="1.2" fill="#F2B33D"/></g></svg>';
function renderTabs(active){
  const nav=$("#tabbar"); if(!nav) return;
  const items=[["home","Home",home],["study","Study",studyHub],["exam","Exams",examHub],["review","Review",reviewHub],["progress","Progress",progress]];
  nav.innerHTML=items.map(([k,l])=>`<button class="tab ${k===active?"on":""}" data-tab="${k}" ${k===active?'aria-current="page"':""}>${icon(k)}<span>${l}</span></button>`).join("");
  nav.hidden=false; document.body.classList.add("has-tabs");
  nav.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{ const it=items.find(x=>x[0]===b.dataset.tab); it[2](); window.scrollTo(0,0); });
}
function hideTabs(){ const nav=$("#tabbar"); if(nav){ nav.hidden=true; nav.innerHTML=""; } document.body.classList.remove("has-tabs"); }
function appHeader(){
  return `<header class="apphead"><div class="brandrow">${PLANE}<span class="brandword">ADRENASKY</span></div>

/* ---- stats ---- */
function chapterStats(tid){
  const qs=QUESTIONS.filter(q=>q.topic===tid); let seenQ=0, seen=0, right=0, mastered=0, wrong=0;
  qs.forEach(q=>{ const c=S.cards[q.id]; if(c&&c.seen>0){ seenQ++; seen+=c.seen; right+=c.right; if(c.box>=3) mastered++; if(isMistake(q)) wrong++; } });
  const acc=seen?right/seen:null, n=qs.length;
  const score=n?0.6*(seenQ/n)*(acc||0)+0.4*(mastered/n):0;
  return {n, seenQ, acc, mastered, wrong, score};
}
function readiness(){
  let ws=0, tot=0; TOPICS.forEach(t=>{ const st=chapterStats(t.id); if(!st.n) return; ws+=t.weight; tot+=t.weight*st.score; });
  return ws?Math.round(100*tot/ws):0;
}
function isMistake(q){ const c=S.cards[q.id]; if(!c||!c.seen) return false; if(c.last===false) return true; if(c.last==null) return c.box===1&&c.right<c.seen; return false; }
function localDay(d){ d=d||new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function markStudyDay(){ const k=localDay(); if(S.days.has(k)) return; S.days.add(k);
  if(USER) sb.from("study_days").upsert({user_id:USER.id, day:k}).then(({error})=>{ if(error) console.warn(error); }); }
function streak(){ let n=0, d=new Date(); if(!S.days.has(localDay(d))) d.setDate(d.getDate()-1);
  while(S.days.has(localDay(d))){ n++; d.setDate(d.getDate()-1); } return n; }
async function toggleSave(qid, btn){
  const on=S.saved.has(qid);
  if(on){ S.saved.delete(qid); const {error}=await sb.from("saved_questions").delete().eq("question_id",qid); if(error){ S.saved.add(qid); return dbErr(error); } }
  else { S.saved.add(qid); const {error}=await sb.from("saved_questions").insert({user_id:USER.id, question_id:qid}); if(error){ S.saved.delete(qid); return dbErr(error); } }
  if(btn){ btn.classList.toggle("on",!on); btn.setAttribute("aria-pressed",String(!on)); btn.setAttribute("aria-label",!on?"Remove from saved":"Save question"); }
  toast(on?"Removed from saved":"Saved for later");
}
const starBtn=q=>`<button class="iconbtn star ${S.saved.has(q.id)?"on":""}" data-star="${q.id}" aria-pressed="${S.saved.has(q.id)}" aria-label="${S.saved.has(q.id)?"Remove from saved":"Save question"}">${icon("review",20)}</button>`;
function wireStars(){ app.querySelectorAll("[data-star]").forEach(b=>b.onclick=()=>toggleSave(b.dataset.star,b)); }
function ringSVG(p){ const r=34, c=2*Math.PI*r, off=c*(1-p/100);
  return `<svg width="88" height="88" viewBox="0 0 88 88" role="img" aria-label="${p}% exam-ready"><circle cx="44" cy="44" r="${r}" fill="none" stroke="var(--line)" stroke-width="9"></circle><circle cx="44" cy="44" r="${r}" fill="none" stroke="var(--chart)" stroke-width="9" stroke-linecap="round" stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}" transform="rotate(-90 44 44)"></circle><text x="44" y="50" text-anchor="middle" class="ringtxt">${p}%</text></svg>`; }
const accCls=a=>a===null?"":(a<0.6?"fail":(a<0.75?"mid":"pass"));
function chapRow(t, chev=true){ const st=chapterStats(t.id);
  return `<button class="chaprow" data-ch="${t.id}"><span class="cr-main"><span class="cr-top"><span class="cr-name">${esc(t.name)}</span><span class="cr-acc ${accCls(st.acc)}">${st.acc===null?"Not started":Math.round(st.acc*100)+"% correct"}</span></span>
    <span class="bar"><span style="width:${st.n?Math.round(100*st.mastered/st.n):0}%;background:var(--magenta)"></span></span></span>${chev?icon("chev",18):""}</button>`; }
function wireChapRows(){ app.querySelectorAll("[data-ch]").forEach(b=>b.onclick=()=>chapterView(b.dataset.ch)); }

/* ===================== HOME ===================== */
function home(){
  if(!SUBJ) return subjectPicker();
  const now=Date.now();
  const due=QUESTIONS.filter(q=>{const c=S.cards[q.id]; return c&&c.box>0&&c.due<=now;}).length;
  const fresh=QUESTIONS.filter(q=>!S.cards[q.id]||!S.cards[q.id].seen).length;
  const started=TOPICS.map(t=>({t,st:chapterStats(t.id)})).filter(x=>x.st.n);
  let weak=started.filter(x=>x.st.acc!==null).sort((a,b)=>a.st.acc-b.st.acc).slice(0,3);
  if(weak.length<3) weak=weak.concat(started.filter(x=>x.st.acc===null).sort((a,b)=>b.t.weight-a.t.weight).slice(0,3-weak.length));
  const plan=due||fresh?`${due?due+" review"+(due===1?"":"s"):""}${due&&fresh?", then ":""}${fresh?Math.min(fresh,15-Math.min(due,15))+" new questions":""}.`:"You're all caught up. Sit a practice exam or drill your weakest chapter.";
  const hy=QUESTIONS.filter(q=>q.hy), hyRight=hy.filter(q=>(S.cards[q.id]||{}).right>0).length;
  screen("home",`
    <section class="card readycard">${ringSVG(readiness())}<div><span class="eyebrow">Exam readiness</span><span class="disp" style="font-size:20px">${esc(SUBJECT)}</span><span class="small">Weighted by how often each chapter is examined.</span></div></section>
    <div class="stat3"><div class="card"><span class="statn">${icon("flame",20)}${streak()}</span><span class="small">day streak</span></div>
      <div class="card"><span class="statn">${due}</span><span class="small">due today</span></div><div class="card"><span class="statn">${fresh}</span><span class="small">not yet seen</span></div></div>
    <section class="card"><h2 class="disp">Today's plan</h2><p class="small" style="margin:6px 0 12px">${plan}</p>
      <button class="primary full" id="go-study" ${!due&&!fresh?"disabled":""}>Continue revision</button></section>
    ${hy.length?`<section class="card"><h2 class="disp">High-yield Top 100</h2><p class="small" style="margin:6px 0 10px">${hyRight} of ${hy.length} answered correctly at least once.</p>
      <div class="bar" style="margin-bottom:12px"><span style="width:${Math.round(100*hyRight/hy.length)}%"></span></div><button class="ghost full" id="go-hy">Practise high-yield</button></section>`:""}
    <section class="card"><h2 class="disp">${weak.some(x=>x.st.acc!==null)?"Your weakest chapters":"Good places to start"}</h2>${weak.map(x=>chapRow(x.t)).join("")}</section>
    <section class="reportcard"><div><b>Sat your KCAA exam?</b><span>Tell us how it went. It helps us improve and helps future students.</span></div><button class="ghost" id="go-result">Report result</button></section>
    ${footerHTML()}`);
  $("#go-study").onclick=()=>study();
  const gh=$("#go-hy"); if(gh) gh.onclick=()=>study("__hy");
  $("#go-result").onclick=()=>resultForm();
  wireChapRows(); wireFooter();
}

function chapterView(tid){
  const t=TOPICS.find(x=>x.id===tid); if(!t) return studyHub();
  const st=chapterStats(tid), idx=TOPICS.indexOf(t)+1;
  const mist=QUESTIONS.filter(q=>q.topic===tid&&isMistake(q)); const n=NOTES[tid];
  const pts=n?(n.points||[]).filter(p=>!/^##\s/.test(p)).slice(0,3):[];
  screen("study",`<button class="link back" id="cb">${icon("back",18)} Study</button>
    <span class="small">${esc(SUBJECT)} · Chapter ${idx}</span><h1 class="disp big">${esc(t.name)}</h1>
    <div class="stat3"><div class="card"><span class="statn ${accCls(st.acc)}">${st.acc===null?"–":Math.round(st.acc*100)+"%"}</span><span class="small">accuracy</span></div>
      <div class="card"><span class="statn">${st.n?Math.round(100*st.mastered/st.n):0}%</span><span class="small">mastered</span></div><div class="card"><span class="statn">${st.n}</span><span class="small">questions</span></div></div>
    <div class="row">${st.n?`<button class="primary" id="c-quiz">Quiz me (${Math.min(10,st.n)})</button>`:""}<button class="ghost" id="c-notes">Read notes</button></div>
    ${mist.length?`<section class="card"><h2 class="disp">Your mistakes here (${mist.length})</h2>${mist.slice(0,5).map(q=>`<button class="qrow" data-q="${q.id}">${icon("x",18,'class="bad"')}<span>${esc(q.q)}</span></button>`).join("")}
      <button class="ghost full" id="c-mist" style="margin-top:10px">Practise ${mist.length===1?"this one":"these "+mist.length}</button></section>`:""}
    ${pts.length?`<section class="card"><h2 class="disp">Key notes</h2><ul class="keyl">${pts.map(p=>`<li>${esc(p)}</li>`).join("")}</ul><button class="link" id="c-notes2">Open full notes</button></section>`:""}`);
  $("#cb").onclick=studyHub;
  const qz=$("#c-quiz"); if(qz) qz.onclick=()=>study(tid);
  $("#c-notes").onclick=()=>noteView(tid); const n2=$("#c-notes2"); if(n2) n2.onclick=()=>noteView(tid);

  app.querySelectorAll("[data-q]").forEach(b=>b.onclick=()=>questionView(b.dataset.q, ()=>chapterView(tid)));

/* ===================== REVIEW: MISTAKES, SAVED, REPORTED ===================== */
function reviewHub(tab){
  tab=tab||reviewHub.tab||"mistakes"; reviewHub.tab=tab;
  const lists={mistakes:QUESTIONS.filter(isMistake), saved:QUESTIONS.filter(q=>S.saved.has(q.id)), reported:QUESTIONS.filter(q=>S.flags.includes(q.id))};
  const blurb={mistakes:"Questions you got wrong last time. Get one right and it leaves this list.",saved:"Questions you starred to come back to. Tap the star on any question to save it.",reported:"Questions you reported as possibly wrong. We check every report."};
  const list=lists[tab];
  screen("review",`<h1 class="disp big">Review</h1>
    <div class="seg3" role="tablist">${[["mistakes","Mistakes"],["saved","Saved"],["reported","Reported"]].map(([k,l])=>`<button role="tab" aria-selected="${k===tab}" data-rt="${k}">${l} ${lists[k].length}</button>`).join("")}</div>
    <p class="small">${blurb[tab]}</p>
    ${list.length&&tab!=="reported"?`<button class="primary full" id="rv-all">Practise ${list.length>20?"20 of these":"all "+list.length}</button>`:""}
    ${list.length?list.slice(0,60).map(q=>`<button class="card qitem" data-q="${q.id}"><span class="small">${esc(topicName(q.topic))}</span><span class="qi">${esc(q.q)}</span></button>`).join("")
      :`<section class="card"><p class="small" style="margin:0">${tab==="mistakes"?"No mistakes to review right now. Nice work.":tab==="saved"?"Nothing saved yet.":"You haven't reported any questions."}</p></section>`}`);
  app.querySelectorAll("[data-rt]").forEach(b=>b.onclick=()=>reviewHub(b.dataset.rt));
  const all=$("#rv-all"); if(all) all.onclick=()=>study(null, list, ()=>reviewHub(tab));
  app.querySelectorAll("[data-q]").forEach(b=>b.onclick=()=>questionView(b.dataset.q, ()=>reviewHub(tab)));
}

/* ===================== EXAMS ===================== */
const EXAM_FORMATS={full:{n:40,min:60,label:"Full exam"},quick:{n:20,min:30,label:"Quick test"}};
function examHub(){
  const st=examHub.st||(examHub.st={fmt:"full",mode:"all",chs:new Set()});
  screen("exam",`<h1 class="disp big">Practice exam</h1>
    <p class="small">Questions come from every chapter in proportion to how often it appears in the real exam. Pass mark ${PASS_MARK}%.</p>
    <fieldset class="opts2"><legend>Format</legend>${Object.entries(EXAM_FORMATS).map(([k,f])=>`<label class="radcard ${st.fmt===k?"on":""}"><input type="radio" name="fmt" value="${k}" ${st.fmt===k?"checked":""}><span><b>${f.label}</b><span class="small">${f.n} questions · ${f.min} minutes</span></span></label>`).join("")}</fieldset>
    <fieldset class="opts2"><legend>Chapters</legend><div class="row"><button class="${st.mode==="all"?"primary":"ghost"}" id="m-all">All chapters</button><button class="${st.mode==="pick"?"primary":"ghost"}" id="m-pick">Choose chapters</button></div>
      ${st.mode==="pick"?`<div class="chklist">${TOPICS.filter(t=>QUESTIONS.some(q=>q.topic===t.id)).map(t=>`<label><input type="checkbox" value="${t.id}" ${st.chs.has(t.id)?"checked":""}> ${esc(t.name)}</label>`).join("")}</div>`:""}</fieldset>
    <button class="primary full" id="go-exam">Start exam</button>
    ${S.exams.length?`<section class="card"><h2 class="disp">Recent exams</h2>${S.exams.slice(0,5).map(e=>`<div class="exrow"><span>${fmtDate(e.date)} · ${e.n} questions</span><b class="${e.pct>=PASS_MARK?"pass":"fail"}">${e.pct}% ${e.pct>=PASS_MARK?"Pass":"Fail"}</b></div>`).join("")}</section>`:""}`);
  app.querySelectorAll('input[name="fmt"]').forEach(r=>r.onchange=()=>{ st.fmt=r.value; examHub(); });
  $("#m-all").onclick=()=>{ st.mode="all"; examHub(); }; $("#m-pick").onclick=()=>{ st.mode="pick"; examHub(); };
  app.querySelectorAll(".chklist input").forEach(c=>c.onchange=()=>{ c.checked?st.chs.add(c.value):st.chs.delete(c.value); });
  $("#go-exam").onclick=()=>{
    if(st.mode==="pick"&&!st.chs.size) return toast("Choose at least one chapter.");
    const f=EXAM_FORMATS[st.fmt]; const qs=pickExam(f.n, st.mode==="pick"?st.chs:null);
    if(!qs.length) return toast("No questions available for that selection.");
    ask(`Start a ${f.label.toLowerCase()}: ${qs.length} questions in ${f.min} minutes? The timer starts straight away.`,"Start exam","Not yet",()=>exam(qs, f.min));
  };
}
function examStart(){ examHub(); }
function exam(qs, minutes){
  hideTabs();
  minutes=minutes||Math.round(qs.length*1.5);
  const answers=new Array(qs.length).fill(null), marked=new Set();
  const orders=qs.map(()=>shuffle([0,1,2,3]));
  let i=0, left=minutes*60;
  stopTimer();
  timerId=setInterval(()=>{ left--; const t=$("#timer"); if(t){t.textContent=fmt(left); t.classList.toggle("low",left<300);} if(left<=0){stopTimer(); toast("Time's up"); finish();} },1000);
  function fmt(s){ s=Math.max(0,s); return Math.floor(s/60)+":"+String(s%60).padStart(2,"0"); }
  function show(){
    const q=qs[i], answered=answers.filter(a=>a!==null).length;
    app.innerHTML=`
      <div class="exhead"><button class="link" id="quit">Leave</button><span class="timer" id="timer" aria-label="Time left">${fmt(left)}</span><button class="ghost small-btn" id="sub">Submit</button></div>
      <div class="bar"><span style="width:${(i+1)/qs.length*100}%"></span></div><div class="exmeta small"><span>Question ${i+1} of ${qs.length}</span><span>${answered} answered${marked.size?" · "+marked.size+" flagged":""}</span></div>
      <article class="qcard">
        <div class="qmeta" style="align-items:center"><span>${esc(topicName(q.topic))}</span><span style="display:flex;align-items:center;gap:2px">${starBtn(q)}<button class="iconbtn flagb ${marked.has(i)?"on":""}" id="mark" aria-pressed="${marked.has(i)}" aria-label="${marked.has(i)?"Remove flag":"Flag to come back to"}">${icon("flag",20)}</button></span></div>
        <p class="qtext">${esc(q.q)}</p>
        <div class="opts">${orders[i].map(o=>`<button class="opt ${answers[i]===o?"sel":""}" data-o="${o}">${esc(q.options[o])}</button>`).join("")}</div>
      </article>
      <div class="row"><button class="ghost" id="prev" ${i===0?"disabled":""}>Previous</button>
        ${i<qs.length-1?`<button class="primary" id="nx">Next</button>`:`<button class="primary" id="sub2">Submit exam</button>`}</div>
      <div class="grid" aria-label="Jump to question">${qs.map((_,k)=>`<button class="${answers[k]!==null?"done":""} ${k===i?"cur":""} ${marked.has(k)?"mk":""}" data-k="${k}" aria-label="Question ${k+1}${answers[k]!==null?", answered":""}${marked.has(k)?", flagged":""}">${k+1}</button>`).join("")}</div>
      <p class="small">Filled: answered · outlined: current · dot: flagged</p>`;
    app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{answers[i]=+b.dataset.o; show();});
    app.querySelectorAll(".grid button").forEach(b=>b.onclick=()=>{i=+b.dataset.k; show();});
    $("#prev").onclick=()=>{if(i>0){i--;show();}};
    const nx=$("#nx"); if(nx) nx.onclick=()=>{i++;show();};
    $("#mark").onclick=()=>{ marked.has(i)?marked.delete(i):marked.add(i); show(); };
    const submit=()=>{ const blank=answers.filter(a=>a===null).length;
      const go=()=>{stopTimer(); finish();};
      ask(blank?`${blank} ${blank===1?"question is":"questions are"} unanswered${marked.size?" and "+marked.size+" flagged":""}. Submit anyway?`:(marked.size?`${marked.size} flagged ${marked.size===1?"question":"questions"} to check. Submit anyway?`:"Submit your exam now?"),"Submit exam","Keep going",go); };
    $("#sub").onclick=submit; const s2=$("#sub2"); if(s2) s2.onclick=submit;
    $("#quit").onclick=()=>ask("Leave the exam? Your answers won't be saved.","Leave exam","Stay",()=>{stopTimer(); examHub();});
    wireStars();
  }
  function finish(){
    let right=0; const byTopic={};
    qs.forEach((q,k)=>{ const ok=answers[k]===q.answer; if(ok) right++; if(answers[k]!==null) record(q.id,ok,false);
      const b=byTopic[q.topic]||(byTopic[q.topic]={r:0,n:0}); b.n++; if(ok) b.r++; });
    const pct=Math.round(right/qs.length*100), passed=pct>=PASS_MARK;
    S.exams.unshift({date:new Date().toISOString(),pct,right,n:qs.length}); S.exams=S.exams.slice(0,30);
    sb.from("exam_attempts").insert({user_id:USER.id, subject_id:SUBJ.id, correct:right, total:qs.length, score_pct:pct, by_topic:byTopic}).then(({error})=>dbErr(error));
    const wrong=qs.map((q,k)=>({q,a:answers[k]})).filter(x=>x.a!==x.q.answer);
    app.innerHTML=`
      <section class="card resultcard"><p class="score ${passed?"pass":"fail"}">${pct}%</p>
        <p>${right} of ${qs.length} correct. ${passed?"Pass.":"Below the "+PASS_MARK+"% pass mark."}</p>
        <div class="row"><button class="primary" id="h">Done</button><button class="ghost" id="again">New exam</button></div></section>
      <h3 class="section">By chapter</h3>
      <div class="wrapx"><table><tr><th>Chapter</th><th>Score</th></tr>
        ${Object.entries(byTopic).sort((a,b)=>a[1].r/a[1].n-b[1].r/b[1].n).map(([t,b])=>`<tr><td>${esc(topicName(t))}</td><td class="${b.r/b.n>=0.75?"pass":"fail"}">${b.r}/${b.n}</td></tr>`).join("")}</table></div>
      ${wrong.length?`<h3 class="section" style="margin-top:26px">Review your mistakes</h3>
        ${wrong.map(({q,a})=>`<article class="qcard"><div class="qmeta"><span>${esc(topicName(q.topic))}</span><span style="display:flex;align-items:center;gap:4px">${q.id}${starBtn(q)}</span></div>
          <p class="qtext">${esc(q.q)}</p>
          ${a!==null?`<p class="fail" style="margin:0 0 6px">Your answer: ${esc(q.options[a])}</p>`:`<p class="fail" style="margin:0 0 6px">Not answered</p>`}
          <p class="pass" style="margin:0">Correct: ${esc(q.options[q.answer])}</p>
          <div class="explain">${esc(q.explanation)}${inlineNotes(q, true)}</div>
          <button class="link rep" data-id="${q.id}">Report a problem with this question</button></article>`).join("")}`:""}`;

function scoreChart(){
  const ex=S.exams.slice(0,8).reverse(); if(!ex.length) return `<p class="small">No exams yet. Sit a practice exam to see your trend.</p>`;
  const bw=300/Math.max(ex.length,5), y=v=>118-v; 
  return `<svg viewBox="0 0 300 130" width="100%" height="140" role="img" aria-label="Recent exam scores: ${ex.map(e=>e.pct+"%").join(", ")}">
    <line x1="0" x2="300" y1="${y(PASS_MARK)}" y2="${y(PASS_MARK)}" stroke="var(--magenta)" stroke-dasharray="4 4"></line><text x="300" y="${y(PASS_MARK)-5}" text-anchor="end" class="charttxt" fill="var(--magenta)">${PASS_MARK}% pass</text>
    ${ex.map((e,k)=>{ const x=k*bw+bw*0.2, w=bw*0.6, hgt=Math.max(2,e.pct); return `<rect x="${x.toFixed(1)}" y="${y(hgt)}" width="${w.toFixed(1)}" height="${hgt}" rx="5" fill="${e.pct>=PASS_MARK?"var(--ok)":"var(--chart)"}"></rect><text x="${(x+w/2).toFixed(1)}" y="${y(hgt)-5}" text-anchor="middle" class="charttxt">${e.pct}</text>`; }).join("")}</svg>`;
}
function progress(tab){
  tab=tab||progress.tab||"stats"; progress.tab=tab;

  if(tab==="exams") body=S.exams.length?`<div class="wrapx"><table><tr><th>Date</th><th>Score</th><th>Result</th></tr>${S.exams.map(e=>`<tr><td>${fmtDate(e.date)}</td><td>${e.right}/${e.n} (${e.pct}%)</td><td class="${e.pct>=PASS_MARK?"pass":"fail"}">${e.pct>=PASS_MARK?"Pass":"Fail"}</td></tr>`).join("")}</table></div>`
    :`<section class="card"><p class="small" style="margin:0">No exams yet.</p></section>`;

    <div class="row"><button class="ghost" id="sup">Contact support</button><button class="ghost" id="logout">Log out</button></div>${footerHTML()}`;
  screen("progress",`<h1 class="disp big">Progress</h1><div class="seg3" role="tablist">${tabs.map(([k,l])=>`<button role="tab" aria-selected="${k===tab}" data-pt="${k}">${l}</button>`).join("")}</div>${body}`);
  app.querySelectorAll("[data-pt]").forEach(b=>b.onclick=()=>progress(b.dataset.pt));
  wireChapRows();
  const pe=$("#p-ex"); if(pe) pe.onclick=examHub;
  if(tab==="kcaa"){ $("#add-res").onclick=()=>resultForm();
    const loadRes=()=>myResultsHTML().then(h=>{ const el=$("#myres"); if(!el) return; el.innerHTML=h;
      el.querySelectorAll(".rdel").forEach(b=>b.onclick=()=>ask("Remove this result?","Remove","Cancel",async()=>{ const {error}=await sb.from("exam_results").delete().eq("id",+b.dataset.id); if(error) toast(error.message); loadRes(); })); });
    loadRes(); }
  if(tab==="account"){
    $("#th").onchange=e=>setTheme(e.target.checked?"night":"light");
    const ga=$("#go-admin"); if(ga) ga.onclick=()=>{ hideTabs(); adminView("overview"); };

      el.querySelectorAll(".rm").forEach(b=>b.onclick=()=>removeDevice(b.dataset.id,b.dataset.l,()=>progress("account"))); });
  }
}

  $("#cta-su").onclick=()=>go("signup"); $("#cta-li").onclick=()=>go("login");
  $("#hdr-price").onclick=()=>{ const el=$("#pricing"); if(el) el.scrollIntoView({behavior:"smooth"}); };
  if(msg){ const c=$("#authcard"); if(c) c.scrollIntoView(); }
  $("#sw").onclick=()=>go(signup?"login":"signup");
  const fg=$("#forgot"); if(fg) fg.onclick=async ()=>{
    const email=$("#f-email").value.trim(); if(!email) return authView("login",{text:"Enter your email first, then tap Forgot password."});
    const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin});

  };

      if(!data.session) return authView("login",{ok:true,text:"Account created. Check your email to confirm it, then log in."});

      if(error) return authView("login",{text:error.message==="Invalid login credentials"?"Wrong email or password.":error.message});
    }
  };

function loading(text){ app.innerHTML=`<section class="briefing"><h2>${esc(text)}</h2><p>One moment…</p></section>`; }

async function loadSubjects(){
  const [sj,tp]=await Promise.all([
    sb.from("subjects").select("id,name,status,sort_order,id_prefix,description").order("sort_order"),
    sb.from("topics").select("id,subject_id,name,weight,sort_order").order("sort_order")]);
  if(sj.error||tp.error) throw (sj.error||tp.error);
  SUBJECTS=sj.data.map(x=>({...x, topics:tp.data.filter(t=>t.subject_id===x.id).map(t=>({id:t.id,name:t.name,weight:Number(t.weight)||1}))}));
}
function setSubject(id){
  SUBJ=SUBJECTS.find(x=>x.id===id); SUBJECT=SUBJ.name; TOPICS=SUBJ.topics;
  try{ localStorage.setItem("adrenasky-subject",id); }catch(e){}
}
async function startApp(){
  loading("Loading your subjects");
  try{ await loadSubjects(); }catch(e){ console.error(e); app.innerHTML=`<section class="briefing"><h2>Couldn't load</h2><p>${esc(e.message||e)}</p><button class="primary" id="retry">Try again</button></section>`; $("#retry").onclick=startApp; return; }
  let saved=null; try{ saved=localStorage.getItem("adrenasky-subject"); }catch(e){}
  const live=SUBJECTS.filter(x=>x.status==="live");
  const pick=live.find(x=>x.id===saved)||(live.length===1?live[0]:null);
  if(pick){ setSubject(pick.id); return loadData(); }
  subjectPicker();
}
function subjectPicker(){
  stopTimer(); hideTabs();
  app.innerHTML=`<header class="top"><h1 class="brand">Adrenasky<small>ATPL theory revision</small></h1></header>
    <h3 class="section">What are you studying today?</h3>
    <ul class="topics">${SUBJECTS.map((x,i)=>{ const live=x.status==="live";
      return `<li class="tap"><button class="trow subj" data-s="${x.id}" ${live?"":"disabled"} style="${live?"":"opacity:.55;cursor:default"}">
        <span class="name">${esc(x.name)}${live?"":'<span class="draft" style="color:var(--muted);border-color:var(--line)">Coming soon</span>'}${SUBJ&&SUBJ.id===x.id?'<span class="draft" style="color:var(--chart);border-color:var(--chart)">Current</span>':""}</span>
        <span class="chev">${live?"›":""}</span><span class="acc">${esc(x.description||(x.topics.length+" chapters"))}</span></button></li>`; }).join("")}</ul>`;
  app.querySelectorAll(".subj:not([disabled])").forEach(b=>b.onclick=()=>{ setSubject(b.dataset.s); loadData(); });
}
async function loadData(next){
  loading("Loading "+(SUBJECT||"your revision"));
  const [q,p,e,r]=await Promise.all([
    sb.from("questions").select("id,topic_id,question,options,answer,explanation,is_active,key_points,compare,is_high_yield").eq("subject_id",SUBJ.id).order("id"),
    sb.from("card_progress").select("question_id,box,due_at,seen,correct,last_correct"),
    sb.from("exam_attempts").select("taken_at,correct,total,score_pct").eq("subject_id",SUBJ.id).order("taken_at",{ascending:false}).limit(30),
    sb.from("question_reports").select("question_id")
  ]);
  const [sv,dy]=await Promise.all([sb.from("saved_questions").select("question_id"), sb.from("study_days").select("day").order("day",{ascending:false}).limit(400)]);
  const nt=await sb.from("notes").select("topic_id,points,aid,trap,is_draft").in("topic_id",TOPICS.map(t=>t.id).concat(["-"]));
  NOTES={}; (nt.data||[]).forEach(n=>NOTES[n.topic_id]=n);
  const pr=await sb.from("profiles").select("is_admin").eq("id",USER.id).maybeSingle();
  IS_ADMIN=!!(pr.data&&pr.data.is_admin);
  const err=q.error||p.error||e.error||r.error;
  if(err){ console.error(err); app.innerHTML=`<section class="briefing"><h2>Couldn't load</h2><p>${esc(err.message)}</p><button class="primary" id="retry">Try again</button></section>`; $("#retry").onclick=loadData; return; }
  FOCUS={}; COMPARE={};
  q.data.forEach(x=>{ if(x.key_points&&x.key_points.length) FOCUS[x.id]=x.key_points; if(x.compare) COMPARE[x.id]=x.compare; });
  QUESTIONS=q.data.filter(x=>x.is_active!==false).map(x=>({id:x.id, topic:x.topic_id, q:x.question, options:x.options, answer:x.answer, explanation:x.explanation, hy:!!x.is_high_yield}));
  S={cards:{},exams:[],flags:[],saved:new Set(((sv&&sv.data)||[]).map(x=>x.question_id)),days:new Set(((dy&&dy.data)||[]).map(x=>String(x.day).slice(0,10)))};
  p.data.forEach(c=>S.cards[c.question_id]={box:c.box,due:new Date(c.due_at).getTime(),seen:c.seen,right:c.correct,last:c.last_correct});
  S.exams=e.data.map(x=>({date:x.taken_at,pct:x.score_pct,right:x.correct,n:x.total}));
  S.flags=[...new Set(r.data.map(x=>x.question_id))];
  (next||home)();
}

function editSubject(id){
  const x=id?SUBJECTS.find(s=>s.id===id):{id:"",name:"",status:"coming_soon",id_prefix:"",description:"",sort_order:SUBJECTS.length+1,topics:[],_new:true};
  const ch=x.topics.map(t=>({...t}));
  const draw=()=>{
    app.innerHTML=`<button class="link back" id="cb">Back without saving</button>
    <h2 class="cond" style="font-size:30px;margin:6px 0 12px;color:var(--chart)">${x._new?"New subject":esc(x.name)}</h2>
    <div class="auth">
      <label>Subject name<input id="s-n" value="${esc(x.name)}" placeholder="e.g. Air Law"></label>
      ${x._new?`<label>Short code (letters only, permanent)<input id="s-id" placeholder="e.g. law" value="${esc(x.id)}"></label>`:""}
      <label>Question ID prefix<input id="s-p" value="${esc(x.id_prefix||"")}" placeholder="e.g. LAW"></label>
      <label>Short description (optional)<input id="s-d" value="${esc(x.description||"")}"></label>
      <label>Status<select id="s-st">${[["live","Live"],["coming_soon","Coming soon"],["hidden","Hidden"]].map(([v,l])=>`<option value="${v}" ${x.status===v?"selected":""}>${l}</option>`).join("")}</select></label>
      <label>Position in the list<input id="s-o" type="number" min="1" value="${x.sort_order||1}"></label>
    </div>
    <h3 class="section" style="margin-top:22px">Chapters</h3>
    <p class="small" style="margin-top:0">Weight is the chapter's approximate share (%) of real exam questions. It decides how often it appears in practice exams.</p>
    <div id="chs">${ch.map((t,i)=>`<div class="chrow"><span class="small">${i+1}.</span><input data-i="${i}" data-k="name" value="${esc(t.name)}" placeholder="Chapter name"><input data-i="${i}" data-k="weight" type="number" step="0.1" min="0" value="${t.weight}" style="max-width:90px" title="Weight %">
      <button class="link mv" data-i="${i}" data-d="-1" title="Move up">↑</button><button class="link mv" data-i="${i}" data-d="1" title="Move down">↓</button>${t.id?"":`<button class="link rmc" data-i="${i}">Remove</button>`}</div>`).join("")}</div>
    <div class="row" style="margin-top:10px"><button class="ghost" id="addc">Add a chapter</button><button class="primary" id="s-save">Save subject</button></div>
    <p class="small">Chapters that already have questions can be renamed or reordered but not removed here.</p>`;
    const sync=()=>app.querySelectorAll("#chs input").forEach(inp=>{ const t=ch[+inp.dataset.i]; t[inp.dataset.k]=inp.dataset.k==="weight"?Number(inp.value)||0:inp.value; });
    const keep=()=>{ x.name=$("#s-n").value; if($("#s-id")) x.id=$("#s-id").value; x.id_prefix=$("#s-p").value; x.description=$("#s-d").value; x.status=$("#s-st").value; x.sort_order=+$("#s-o").value||1; };
    $("#cb").onclick=()=>adminView("subjects");
    $("#addc").onclick=()=>{ sync(); keep(); ch.push({id:null,name:"",weight:2}); draw(); };
    app.querySelectorAll(".rmc").forEach(b=>b.onclick=()=>{ sync(); keep(); ch.splice(+b.dataset.i,1); draw(); });
    app.querySelectorAll(".mv").forEach(b=>b.onclick=()=>{ sync(); keep(); const i=+b.dataset.i, j=i+(+b.dataset.d); if(j<0||j>=ch.length) return; [ch[i],ch[j]]=[ch[j],ch[i]]; draw(); });
    $("#s-save").onclick=async()=>{
      sync(); keep();
      const sid=(x.id||"").trim().toLowerCase();
      if(!x.name.trim()) return toast("Give the subject a name.");
      if(!/^[a-z]{2,12}$/.test(sid)) return toast("Short code: 2 to 12 letters, no spaces.");
      if(x._new&&SUBJECTS.some(s=>s.id===sid)) return toast("That short code is already used.");
      if(ch.some(t=>!t.name.trim())) return toast("Every chapter needs a name.");
      const prefix=(x.id_prefix||sid).trim().toUpperCase().replace(/[^A-Z0-9]/g,"");
      const {error:e1}=await sb.from("subjects").upsert({id:sid,name:x.name.trim(),status:x.status,id_prefix:prefix,description:x.description.trim()||null,sort_order:x.sort_order,is_published:x.status==="live"});
      if(e1) return toast("Couldn't save: "+e1.message);
      const slug=n=>n.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,24)||"chapter";
      const used=new Set(ch.filter(t=>t.id).map(t=>t.id));
      const rows=ch.map((t,i)=>{ let tid=t.id; if(!tid){ tid=sid+"-"+slug(t.name); let k=2; while(used.has(tid)) tid=sid+"-"+slug(t.name)+"-"+(k++); used.add(tid); }
        return {id:tid, subject_id:sid, name:t.name.trim(), weight:t.weight, sort_order:i+1}; });
      if(rows.length){ const {error:e2}=await sb.from("topics").upsert(rows); if(e2) return toast("Subject saved, but chapters failed: "+e2.message); }
      toast("Subject saved");
      await loadSubjects(); if(SUBJ) setSubject(SUBJ.id);
      adminView("subjects");
    };
  };
  draw();
}

    const {error}=q._new?await sb.from("questions").insert(row):await sb.from("questions").update(row).eq("id",q.id);
    if(error) return toast("Couldn't save: "+error.message);
    if(row.key_points.length) FOCUS[row.id]=row.key_points; else delete FOCUS[row.id];
    const local={id:row.id, topic:row.topic_id, q:row.question, options:row.options, answer:row.answer, explanation:row.explanation, hy:row.is_high_yield};
    const i=QUESTIONS.findIndex(x=>x.id===row.id);
    if(row.is_active){ if(i>=0) QUESTIONS[i]=local; else QUESTIONS.push(local); } else if(i>=0) QUESTIONS.splice(i,1);
    toast(q._new?"Question added":"Saved");
    if(back==="reports") ask("Mark this question's reports as fixed too?","Mark as fixed","Not yet",async()=>{ await rpc("admin_resolve_reports",{p_question_id:row.id}); adminView("reports"); });
    adminView(back);
  };
}

/* ===================== KCAA EXAM RESULTS ===================== */
function resultForm(){
  stopTimer();
  const live=SUBJECTS.filter(x=>x.status==="live");
  const today=new Date().toISOString().slice(0,10);
  app.innerHTML=`<button class="link back" id="rb">Back</button>
    <h2 class="cond" style="font-size:32px;margin:6px 0 6px;color:var(--chart)">Report your KCAA exam</h2>
    <p class="small" style="margin-top:0">Your result helps us improve the questions and shows future students what works. Only you and the Adrenasky team can see it.</p>
    <div class="auth">
      <label>Subject<select id="r-s">${live.map(x=>`<option value="${x.id}" ${SUBJ&&SUBJ.id===x.id?"selected":""}>${esc(x.name)}</option>`).join("")}</select></label>
      <label>Exam date<input id="r-d" type="date" max="${today}" value="${today}"></label>
      <fieldset class="seg"><legend>Result</legend>
        <label><input type="radio" name="r-r" value="pass"> Passed</label>
        <label><input type="radio" name="r-r" value="fail"> Didn't pass this time</label></fieldset>
      <label>Score % (optional)<input id="r-p" type="number" min="0" max="100" inputmode="numeric" placeholder="e.g. 82"></label>
      <label>Attempt<select id="r-a"><option value="1">First attempt</option><option value="2">Second attempt</option><option value="3">Third attempt or later</option></select></label>
      <label>Anything you'd tell other students? (optional)<textarea id="r-t" rows="3" maxlength="600" placeholder="What helped, what surprised you in the exam…"></textarea></label>
      <label style="display:flex;gap:8px;align-items:flex-start;font-weight:400"><input type="checkbox" id="r-c" style="min-height:auto;width:20px;height:20px;margin-top:2px"> Adrenasky may quote my comment with my first name.</label>
      <div class="row"><button class="primary" id="r-go">Submit result</button></div>
    </div>`;
  $("#rb").onclick=()=>home();
  $("#r-go").onclick=async()=>{
    const r=(app.querySelector('input[name="r-r"]:checked')||{}).value;
    if(!r) return toast("Choose whether you passed.");
    const d=$("#r-d").value; if(!d) return toast("Add the exam date.");
    const pv=$("#r-p").value.trim(); const score=pv===""?null:Math.round(Number(pv));
    if(score!==null&&(isNaN(score)||score<0||score>100)) return toast("Score must be between 0 and 100.");
    const sid=$("#r-s").value, text=$("#r-t").value.trim();
    const btn=$("#r-go"); btn.disabled=true; btn.textContent="Saving…";
    const {error}=await sb.from("exam_results").insert({user_id:USER.id, subject_id:sid, exam_date:d, result:r, score_pct:score,
      attempt:+$("#r-a").value, testimonial:text||null, consent_to_quote:!!text&&$("#r-c").checked});
    if(error){ btn.disabled=false; btn.textContent="Submit result"; return toast("Couldn't save: "+error.message); }
    const name=(SUBJECTS.find(x=>x.id===sid)||{}).name||"your subject";
    app.innerHTML=r==="pass"
      ?`<section class="briefing"><h2>Congratulations!</h2><p>Well done on passing ${esc(name)}. Thank you for letting us know; results like yours show other students what works.</p><div class="row"><button class="primary" id="rh">Back to revision</button></div></section>`
      :`<section class="briefing"><h2>Thanks for telling us</h2><p>Plenty of pilots pass ${esc(name)} on their next attempt. Focus your revision on the chapters where your accuracy is lowest, and sit a few timed practice exams before you rebook.</p><div class="row"><button class="primary" id="rh">Back to revision</button></div></section>`;
    $("#rh").onclick=()=>home();
  };
}
async function myResultsHTML(){
  const {data}=await sb.from("exam_results").select("id,subject_id,exam_date,result,score_pct,attempt").order("exam_date",{ascending:false});
  if(!data||!data.length) return `<p class="small">No exam results reported yet.</p>`;
  return `<div class="wrapx"><table><tr><th>Date</th><th>Subject</th><th>Result</th><th></th></tr>${data.map(x=>`<tr><td>${fmtDate(x.exam_date)}</td>
    <td>${esc((SUBJECTS.find(s=>s.id===x.subject_id)||{}).name||x.subject_id)}</td>
    <td class="${x.result==="pass"?"pass":"fail"}">${x.result==="pass"?"Passed":"Not passed"}${x.score_pct!==null?" ("+x.score_pct+"%)":""}</td>
    <td><button class="link rdel" data-id="${x.id}">Remove</button></td></tr>`).join("")}</table></div>`;
}
async function resultsAdmin(){
  const el=$("#adm");
  const [sum,rows]=await Promise.all([rpc("admin_results_summary"),rpc("admin_results")]);
  el.innerHTML=`<p class="small">Results students have reported from their KCAA exams. Pass rates become meaningful once each subject has 10 or more reports.</p>
    ${sum.length?`<div class="wrapx"><table><tr><th>Subject</th><th>Reported</th><th>Passed</th><th>Pass rate</th><th>First-time pass rate</th><th>Average score</th></tr>
      ${sum.map(x=>`<tr><td>${esc(x.subject)}</td><td>${x.reported}</td><td>${x.passed}</td><td>${pct(x.pass_rate)}</td><td>${pct(x.first_time_pass_rate)}</td><td>${pct(x.avg_score)}</td></tr>`).join("")}</table></div>`:`<p class="small">No results reported yet.</p>`}
    ${rows.length?`<h3 class="section" style="margin-top:24px">All reports</h3>
      ${rows.map(x=>`<article class="qcard"><div class="qmeta"><span>${esc(x.full_name||x.email)} · ${esc(x.subject)}</span><span>${fmtDate(x.exam_date)}</span></div>
        <p style="margin:0" class="${x.result==="pass"?"pass":"fail"}"><b>${x.result==="pass"?"Passed":"Not passed"}</b>${x.score_pct!==null?" with "+x.score_pct+"%":""} · attempt ${x.attempt}${x.attempt>=3?"+":""} · ${x.questions_answered} answers practised in the app</p>
        ${x.testimonial?`<blockquote class="quote">"${esc(x.testimonial)}"</blockquote><p class="small" style="margin:0">${x.consent_to_quote?"May be quoted with first name":"Not for publication"}</p>`:""}</article>`).join("")}`:""}`;
}

/* ===================== DEVICE LIMIT ===================== */
const fmtDate=d=>new Date(d).toLocaleDateString(undefined,{day:"numeric",month:"short",year:"numeric"});
async function checkDevice(){
  document.body.classList.remove("landing-on"); applyTheme(); hideTabs();
  loading("Checking your device");
  const {data,error}=await sb.rpc("register_device",{p_label:deviceLabel()});
  if(error){ console.error(error); app.innerHTML=`<section class="briefing"><h2>Couldn't check this device</h2><p>${esc(error.message)}</p><button class="primary" id="retry">Try again</button></section>`; $("#retry").onclick=checkDevice; return; }
  if(data==="ok") return startApp();
  if(data==="limit") return deviceLimitView();
  if(data==="blocked"){
    app.innerHTML=`<header class="top"><h1 class="brand">Adrenasky<small>ATPL theory revision</small></h1></header>
      <section class="briefing"><h2>Account suspended</h2><p>Access to this account has been suspended. If you think this is a mistake, contact Adrenasky support:</p>
      ${supportLinks("my account has been suspended and I'd like to ask why.")}
      <p style="margin-top:16px"><button class="link" id="lo">Log out</button></p></section>`;
    $("#lo").onclick=()=>sb.auth.signOut(); return;
  }
  app.innerHTML=`<section class="briefing"><h2>This browser can't be registered</h2><p>Please allow site storage (turn off private browsing) and try again.</p><button class="primary" id="retry">Try again</button></section>`; $("#retry").onclick=checkDevice;
}
async function fetchDevices(){
  const [d,p]=await Promise.all([
    sb.from("devices").select("device_id,label,first_seen,last_seen").order("last_seen",{ascending:false}),
    sb.from("profiles").select("device_limit").eq("id",USER.id).maybeSingle()
  ]);
  return {list:d.data||[], limit:(p.data&&p.data.device_limit)||2, error:d.error};
}
function deviceRows(list, allowThis){
  return `<ul class="topics">${list.map(d=>`<li style="grid-template-columns:1fr auto;align-items:center">
    <span><span class="name">${esc(d.label||"Unknown device")}</span>${d.device_id===DEVICE_ID?'<span class="draft" style="color:var(--chart);border-color:var(--chart)">This device</span>':""}<br>
    <span class="small">Last used ${fmtDate(d.last_seen)}</span></span>
    ${(d.device_id!==DEVICE_ID||allowThis)?`<button class="ghost rm" data-id="${esc(d.device_id)}" data-l="${esc(d.label||"this device")}" style="min-height:40px;padding:8px 14px">Remove</button>`:""}</li>`).join("")}</ul>`;
}
async function removeDevice(id, label, after){
  ask(`Remove ${label}? It will need to log in again and count as a new device. You can remove up to 2 devices every 30 days.`,"Remove","Cancel",async ()=>{
    const {data,error}=await sb.rpc("remove_device",{p_device_id:id});
    if(error){ toast("Couldn't remove: "+error.message); return; }
    if(data==="too_soon"){ toast("You've already removed 2 devices in the last 30 days."); return after(true); }
    toast("Device removed"); after(false);
  });
}
async function deviceLimitView(tooSoon){
  stopTimer(); loading("Checking your devices");
  const {list,limit}=await fetchDevices();
  app.innerHTML=`<header class="top"><h1 class="brand">Adrenasky<small>ATPL ${SUBJECT}</small></h1></header>
    <section class="briefing"><h2>Device limit reached</h2>
    <p>Your account can be used on ${limit} devices. To use this one, remove a device you no longer use.</p>
    ${tooSoon?`<p class="fail" style="font-weight:700">You've already removed 2 devices in the last 30 days. Please try again later or contact Adrenasky support.</p>${supportLinks("I've reached my device limit and need help removing a device.")}`:""}
    </section>
    <h3 class="section">Your devices</h3>${deviceRows(list,false)}
    <p class="small" style="margin-top:14px">Each browser counts as a device, so Chrome and Safari on the same laptop are two devices. You can remove up to 2 devices every 30 days.</p>
    <p><button class="link" id="lo">Log out</button></p>`;
  app.querySelectorAll(".rm").forEach(b=>b.onclick=()=>removeDevice(b.dataset.id,b.dataset.l,ts=>ts?deviceLimitView(true):checkDevice()));
  $("#lo").onclick=()=>sb.auth.signOut();
}

let booted=false;
sb.auth.onAuthStateChange((event, session)=>{
  const u=session?session.user:null;
  if(event==="PASSWORD_RECOVERY"){ return newPassword(); }
  if(u && (!USER || USER.id!==u.id)){ USER=u; checkDevice(); }
  else if(!u){ USER=null; authView("login"); }
  booted=true;
});
function newPassword(){
  app.innerHTML=`<section class="briefing"><h2>Set a new password</h2>
    <div class="auth"><label>New password<input id="np" type="password" minlength="6" autocomplete="new-password"></label>
    <button class="primary" id="np-go">Save password</button></div></section>`;
  $("#np-go").onclick=async ()=>{ const {error}=await sb.auth.updateUser({password:$("#np").value});
    if(error) toast(error.message); else { toast("Password updated"); checkDevice(); } };
}
loading("Starting up");
</script>
